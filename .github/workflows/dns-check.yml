name: dns-check
on:
  push:
    paths: ['.github/workflows/dns-check.yml']
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
      - name: health check
        run: |
          gem install github-pages-health-check --no-document >/dev/null 2>&1 || gem install github-pages-health-check --no-document
          cat > hc.rb <<'RB'
          require 'github-pages-health-check'
          require 'json'
          %w[sakhalyy-sanar.ru www.sakhalyy-sanar.ru].each do |d|
            puts "===== #{d}"
            begin
              c = GitHubPages::HealthCheck::Domain.new(d)
              h = c.to_hash rescue {}
              puts JSON.pretty_generate(h.select{|k,_| %i[valid? reason dns_resolves? proxied? cloudflare_ip? a_record? cname_record? pointed_to_github_pages_ip? should_be_a_record? caa_error enforces_https? https? https_error dns_zone_soa? dns_zone_ns? apex_domain? should_be_cname_record?].include?(k)}.transform_values(&:to_s))
              begin; c.check!; puts "check!: OK"; rescue => e; puts "check!: #{e.class}: #{e.message}"; end
              puts "dns: " + (c.dns.map{|r| "#{r.type} #{r.respond_to?(:address) ? r.address : (r.respond_to?(:name) ? r.name : r.to_s)}"} rescue $!.inspect).inspect
            rescue => e
              puts "ERROR #{e.class}: #{e.message}"; puts e.backtrace.first(5)
            end
          end
          RB
          ruby hc.rb > dns-result.txt 2>&1 || true
          echo "== gem $(gem list github-pages-health-check | tail -1)" >> dns-result.txt
          git config user.name dns-check; git config user.email dns-check@users.noreply.github.com
          git add dns-result.txt; git commit -m "Результат проверки домена"; git push
